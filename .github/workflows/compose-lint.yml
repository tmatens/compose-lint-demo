name: Compose Lint

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  compose-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read          # checkout
      security-events: write  # upload the SARIF to Code Scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Temporary: run an unreleased compose-lint commit through the same
      # upload path, to check that tagged output keeps existing alerts.
      - run: |
          pipx install "git+https://github.com/tmatens/compose-lint@f5bab47a3b6f3fd1bce2d2987d1b8ab33377ee1c"
          compose-lint --format sarif --output results.sarif docker-compose.yml || true
      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
